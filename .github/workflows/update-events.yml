name: Update events from rabka.pl

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run rabka.pl scraper
        run: python scraper/scraper.py

      - name: Run CKSiP scraper
        run: python scraper/scraper_cksip.py

      - name: Run VisitMalopolska scraper
        # This source has bot-detection that may block CI runs entirely —
        # don't fail the whole workflow if it does, just skip its update.
        continue-on-error: true
        run: python scraper/scraper_visitmalopolska.py

      - name: Regenerate events.ics
        run: python scraper/generate_ics.py

      - name: Commit changes if any
        run: |
          git config user.name "rabka-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events-auto.json data/events-cksip.json data/events-visitmalopolska.json events.ics
          git diff --cached --quiet || git commit -m "Auto-update events from rabka.pl, CKSiP and VisitMalopolska"
          git push
